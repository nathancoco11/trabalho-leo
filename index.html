<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nathan Superior Web - Mobile</title>
    
    <style>
        :root {
            --neon-ciano: #0ff;
            --neon-azul: #00f;
            --neon-marinho: #0077be;
            --texto: #f0f0f0;
            --fundo: #000;
            --card: #0a0a0a;
            --borda: #222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--fundo);
            color: var(--texto);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Bolinhas neon de fundo */
        .neon-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.4;
            filter: blur(10px);
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            50% { transform: translate(-20px, 30px) scale(1.1); opacity: 0.5; }
        }

        /* Navbar mobile */
        .navbar {
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--neon-ciano);
            box-shadow: 0 0 10px var(--neon-ciano);
            backdrop-filter: blur(10px);
        }

        .logo {
            color: white;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 5px var(--neon-ciano);
            flex: 1;
        }

        .logo span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo small {
            display: none;
        }

        .nav-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-icon {
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 6px;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 6px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--neon-ciano);
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 0 8px var(--neon-ciano);
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--neon-ciano);
            color: var(--neon-ciano);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            cursor: pointer;
        }

        body.logged-in .user-info {
            display: flex;
        }

        body.logged-in .login-btn-nav {
            display: none;
        }

        /* Conteúdo principal */
        .content {
            padding: 20px 15px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .welcome {
            text-align: center;
            padding: 15px;
            margin-bottom: 10px;
        }

        .welcome h1 {
            font-size: 1.3rem;
            color: var(--neon-ciano);
            text-shadow: 0 0 8px var(--neon-ciano);
            margin-bottom: 8px;
        }

        .welcome p {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .destaque {
            color: var(--neon-ciano);
            font-weight: bold;
        }

        /* Cards / Botões */
        .card {
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid var(--neon-ciano);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: white;
            box-shadow: 0 0 10px var(--neon-azul), inset 0 0 20px rgba(0, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.97);
            box-shadow: 0 0 20px var(--neon-ciano);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--neon-ciano);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--neon-ciano);
            text-shadow: 0 0 8px var(--neon-ciano);
            flex-shrink: 0;
        }

        .card-info {
            flex: 1;
        }

        .card-info h2 {
            font-size: 1.1rem;
            margin-bottom: 3px;
        }

        .card-info p {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .card-arrow {
            color: var(--neon-ciano);
            font-size: 1rem;
            opacity: 0.7;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--card);
            margin: 20% auto;
            padding: 25px 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 0 20px var(--neon-ciano);
            position: relative;
            border: 1px solid var(--neon-ciano);
        }

        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #ff6b6b;
            background: none;
            border: none;
            padding: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--neon-ciano);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--neon-ciano);
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--texto);
            -webkit-appearance: none;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-ciano);
        }

        .login-btn {
            background: var(--neon-marinho);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 0 10px var(--neon-marinho);
            font-weight: bold;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .switch-form {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .switch-btn {
            background: none;
            border: none;
            color: var(--neon-ciano);
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.9rem;
        }

        .status-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
        }

        .success {
            background: rgba(39, 174, 96, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .error {
            background: rgba(231, 76, 60, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        h2.modal-title {
            color: var(--neon-ciano);
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 5px var(--neon-ciano);
            font-size: 1.3rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px 15px;
            font-size: 0.75rem;
            opacity: 0.6;
            border-top: 1px solid var(--borda);
            margin-top: 20px;
        }

        /* Tela muito pequena */
        @media (max-width: 360px) {
            .logo { font-size: 0.9rem; }
            .card { padding: 15px; }
            .card-icon { width: 42px; height: 42px; font-size: 1.2rem; }
            .card-info h2 { font-size: 1rem; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-star" style="color: var(--neon-ciano);"></i>
            <span>Nathan Superior</span>
        </div>
        
        <div class="nav-icons">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <button class="logout-btn" id="logoutBtn">Sair</button>
            </div>
            <button class="nav-icon login-btn-nav" id="loginBtnNav" title="Login">
                <i class="fas fa-user"></i>
            </button>
        </div>
    </nav>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <button class="close">&times;</button>
            
            <div id="loginForm">
                <h2 class="modal-title">Entrar</h2>
                
                <form id="login">
                    <div class="form-group">
                        <label for="loginUsername"><i class="fas fa-user"></i> Usuário</label>
                        <input type="text" id="loginUsername" placeholder="Seu nome de usuário" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword"><i class="fas fa-lock"></i> Senha</label>
                        <input type="password" id="loginPassword" placeholder="Sua senha" required>
                    </div>
                    
                    <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Entrar</button>
                    
                    <div id="loginMessage" class="status-message" style="display: none;"></div>
                </form>
                
                <div class="switch-form">
                    <span>Não tem conta? </span>
                    <button class="switch-btn" id="showRegister">Registre-se</button>
                </div>
            </div>
            
            <div id="registerForm" style="display: none;">
                <h2 class="modal-title">Criar Conta</h2>
                
                <form id="register">
                    <div class="form-group">
                        <label for="registerUsername"><i class="fas fa-user-edit"></i> Usuário</label>
                        <input type="text" id="registerUsername" placeholder="Escolha um usuário" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="registerPassword"><i class="fas fa-key"></i> Senha</label>
                        <input type="password" id="registerPassword" placeholder="Crie uma senha" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-check-circle"></i> Confirmar Senha</label>
                        <input type="password" id="confirmPassword" placeholder="Repita a senha" required>
                    </div>
                    
                    <button type="submit" class="login-btn"><i class="fas fa-user-plus"></i> Registrar</button>
                    
                    <div id="registerMessage" class="status-message" style="display: none;"></div>
                </form>
                
                <div class="switch-form">
                    <span>Já tem conta? </span>
                    <button class="switch-btn" id="showLogin">Faça login</button>
                </div>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="welcome">
            <h1 id="welcomeTitle">Bem-vindo!</h1>
            <p id="welcomeMessage">Site oficial de <span class="destaque">Nathan</span></p>
        </div>

        <a href="personagens.html" class="card">
            <div class="card-icon"><i class="fas fa-users"></i></div>
            <div class="card-info">
                <h2>Personagens</h2>
                <p>Conheça todos os personagens</p>
            </div>
            <i class="fas fa-chevron-right card-arrow"></i>
        </a>

        <a href="lojinha.html" class="card">
            <div class="card-icon"><i class="fas fa-store"></i></div>
            <div class="card-info">
                <h2>Lojinha</h2>
                <p>Produtos exclusivos</p>
            </div>
            <i class="fas fa-chevron-right card-arrow"></i>
        </a>

        <a href="livros.html" class="card">
            <div class="card-icon"><i class="fas fa-book"></i></div>
            <div class="card-info">
                <h2>Livros do Canal</h2>
                <p>Explore nossos livros</p>
            </div>
            <i class="fas fa-chevron-right card-arrow"></i>
        </a>
    </div>

    <div class="footer">
        <p>Site oficial de Nathan • Todos os direitos reservados</p>
    </div>

    <script>
        // Elementos
        const loginModal = document.getElementById('loginModal');
        const loginBtnNav = document.getElementById('loginBtnNav');
        const closeBtn = document.querySelector('.close');
        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginSubmit = document.getElementById('login');
        const registerSubmit = document.getElementById('register');
        const loginMessage = document.getElementById('loginMessage');
        const registerMessage = document.getElementById('registerMessage');
        const logoutBtn = document.getElementById('logoutBtn');
        const userAvatar = document.getElementById('userAvatar');
        const welcomeTitle = document.getElementById('welcomeTitle');
        const welcomeMessage = document.getElementById('welcomeMessage');

        // Verificar login
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const username = localStorage.getItem('currentUser');
            
            if (isLoggedIn && username) {
                document.body.classList.add('logged-in');
                userAvatar.textContent = username.charAt(0).toUpperCase();
                welcomeTitle.textContent = `Olá, ${username}! 👋`;
                welcomeMessage.innerHTML = 'Bem-vindo de volta ao site de <span class="destaque">Nathan</span>';
            } else {
                document.body.classList.remove('logged-in');
                welcomeTitle.textContent = 'Bem-vindo!';
                welcomeMessage.innerHTML = 'Site oficial de <span class="destaque">Nathan</span>';
            }
        }

        // Abrir modal
        loginBtnNav.addEventListener('click', () => {
            loginModal.style.display = 'block';
        });

        // Fechar modal
        closeBtn.addEventListener('click', () => {
            loginModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === loginModal) {
                loginModal.style.display = 'none';
            }
        });

        // Alternar forms
        showRegister.addEventListener('click', () => {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        });

        showLogin.addEventListener('click', () => {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
        });

        // Registrar
        registerSubmit.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage(registerMessage, "As senhas não coincidem!", 'error');
                return;
            }

            if (password.length < 4) {
                showMessage(registerMessage, "A senha deve ter pelo menos 4 caracteres!", 'error');
                return;
            }

            const usuarios = JSON.parse(localStorage.getItem('usuarios_magicos') || '[]');
            
            if (usuarios.some(u => u.username === username)) {
                showMessage(registerMessage, "Este usuário já existe!", 'error');
                return;
            }
            
            usuarios.push({ username, password });
            localStorage.setItem('usuarios_magicos', JSON.stringify(usuarios));
            
            showMessage(registerMessage, "Conta criada com sucesso!", 'success');
            this.reset();
            
            setTimeout(() => {
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
                registerMessage.style.display = 'none';
            }, 1800);
        });

        // Login
        loginSubmit.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            const usuarios = JSON.parse(localStorage.getItem('usuarios_magicos') || []);
            const user = usuarios.find(u => u.username === username && u.password === password);
            
            if (user) {
                showMessage(loginMessage, "Login bem-sucedido!", 'success');
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', username);
                
                setTimeout(() => {
                    loginModal.style.display = 'none';
                    loginSubmit.reset();
                    loginMessage.style.display = 'none';
                    checkLoginStatus();
                }, 1000);
            } else {
                showMessage(loginMessage, "Usuário ou senha incorretos!", 'error');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.setItem('isLoggedIn', 'false');
            localStorage.removeItem('currentUser');
            checkLoginStatus();
        });

        // Mostrar mensagens
        function showMessage(element, text, type) {
            element.textContent = text;
            element.style.display = 'block';
            element.className = `status-message ${type}`;
        }

        // Bolinhas neon
        function createNeonCircles() {
            const colors = ['#0ff', '#00f', '#0077be'];
            document.querySelectorAll('.neon-circle').forEach(el => el.remove());
            
            for (let i = 0; i < 10; i++) {
                const circle = document.createElement('div');
                circle.classList.add('neon-circle');
                
                const size = Math.random() * 60 + 20;
                circle.style.width = `${size}px`;
                circle.style.height = `${size}px`;
                circle.style.left = `${Math.random() * 100}vw`;
                circle.style.top = `${Math.random() * 100}vh`;
                
                const color = colors[Math.floor(Math.random() * colors.length)];
                circle.style.background = color;
                circle.style.boxShadow = `0 0 15px ${color}`;
                circle.style.animationDelay = `${Math.random() * 5}s`;
                
                document.body.appendChild(circle);
            }
        }

        window.addEventListener('load', createNeonCircles);
        checkLoginStatus();
    </script>
</body>
</html>
